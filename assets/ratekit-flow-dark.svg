<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
<title id="t">ratekit event flow</title>
<desc id="d">A usage source posts events to ingest, which writes them to the Kafka topic usage-events with three partitions. The rating consumer group prices each event and stores the charge in PostgreSQL. Duplicate events are skipped and events the account cannot afford are rejected. Billing is planned.</desc>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#e6edf3}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:#9198a1}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;fill:#9198a1}
.p{font-size:11px;font-weight:600;fill:#9198a1;paint-order:stroke;stroke:#21262d;stroke-width:6px}
.box{fill:#161b22;stroke:#30363d;stroke-width:1.5}
.lane{fill:#21262d;stroke:none}
.flow{fill:none;stroke:#6e7681;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.arr{fill:#6e7681}
.plan{fill:none;stroke:#6e7681;stroke-width:1.5;stroke-dasharray:6 5}
.dot{fill:#58a6ff}.dot.dup{fill:#d29922}.dot.rej{fill:#f85149}
.lbl{font-size:13px;font-weight:600}.lbl.dup{fill:#d29922}.lbl.rej{fill:#f85149}
.still{display:none}
@media (prefers-reduced-motion:reduce){.live{display:none}.still{display:inline}}
</style>
<path class="flow" d="M126,215 H166 M736,215 H786"/>
<path class="arr" d="M166,215 l-8,-5 v10 z"/>
<path class="arr" d="M606,215 l-8,-5 v10 z"/>
