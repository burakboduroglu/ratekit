<text class="t" x="71" y="209" text-anchor="middle">usage</text><text class="t" x="71" y="229" text-anchor="middle">source</text>
<text class="s" x="71" y="250" text-anchor="middle">SMS, MB, min</text>
<rect class="box" x="166" y="165" width="120" height="100" rx="10"/>
<text class="t" x="226" y="186" text-anchor="middle">ingest</text><text class="s" x="226" y="202" text-anchor="middle">producer</text>
<text class="m" x="226" y="248" text-anchor="middle">POST /v1/events</text>
<rect class="box" x="336" y="66" width="220" height="260" rx="12"/>
<text class="t" x="446" y="94" text-anchor="middle">usage-events</text>
<text class="s" x="446" y="113" text-anchor="middle">Kafka topic</text>
<rect class="lane" x="366" y="146" width="164" height="28" rx="14"/>
<rect class="lane" x="366" y="201" width="164" height="28" rx="14"/>
<rect class="lane" x="366" y="256" width="164" height="28" rx="14"/>
<text class="s" x="446" y="312" text-anchor="middle">key = accountId</text>
<path class="flow" d="M286,215 H316 L366,160 H530 L580,215 H606"/>
<path class="flow" d="M286,215 H316 L366,215 H530 L580,215 H606"/>
<path class="flow" d="M286,215 H316 L366,270 H530 L580,215 H606"/>
<text class="p" x="378" y="164">P0</text>
<text class="p" x="378" y="219">P1</text>
<text class="p" x="378" y="274">P2</text>
<rect class="box" x="606" y="165" width="130" height="100" rx="10"/>
<text class="t" x="671" y="186" text-anchor="middle">rating</text><text class="s" x="671" y="202" text-anchor="middle">consumer group</text>
<path class="box" d="M786,170 a79,14 0 0 1 158,0 v96 a79,14 0 0 1 -158,0 z"/>
<path class="flow" d="M786,170 a79,14 0 0 0 158,0"/>
<text class="t" x="865" y="206" text-anchor="middle">PostgreSQL</text>
<text class="s" x="865" y="230" text-anchor="middle">accounts</text>
<text class="s" x="865" y="248" text-anchor="middle">tariffs</text>
<text class="s" x="865" y="266" text-anchor="middle">charges</text>
<path class="plan" d="M865,292 V334"/><path class="arr" d="M865,344 l-5,-9 h10 z"/>
<rect class="plan" x="786" y="346" width="158" height="52" rx="10"/>
<text class="t" x="865" y="370" text-anchor="middle">billing</text>
<text class="s" x="865" y="388" text-anchor="middle" font-style="italic">planned</text>
