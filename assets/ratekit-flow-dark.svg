<circle class="dot" r="6" cx="0" cy="0" opacity="0"><animateMotion path="M126,215 H316 L366,215 H530 L580,215 H806" dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.18;0.52;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.18;0.2;0.49;0.52;1" dur="9s" repeatCount="indefinite"/></circle>
<circle class="dot" r="6" cx="0" cy="0" opacity="0"><animateMotion path="M126,215 H316 L366,215 H530 L580,215 H806" dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3;0.64;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.32;0.61;0.64;1" dur="9s" repeatCount="indefinite"/></circle>
<circle class="dot" r="6" cx="0" cy="0" opacity="0"><animateMotion path="M126,215 H316 L366,160 H530 L580,215 H806" dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4;0.74;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.42;0.71;0.74;1" dur="9s" repeatCount="indefinite"/></circle>
<circle class="dot dup" r="6" cx="0" cy="0" opacity="0"><animateMotion path="M126,215 H316 L366,215 H530 L580,215 H806" dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;0.7059;0.7059" keyTimes="0;0.46;0.7;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.46;0.48;0.74;0.8;1" dur="9s" repeatCount="indefinite"/><animate attributeName="r" values="6;6;6;1.5;1.5" keyTimes="0;0.7;0.74;0.8;1" dur="9s" repeatCount="indefinite"/></circle><text class="lbl dup" x="671" y="148" text-anchor="middle" opacity="0">duplicate skipped<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7;0.73;0.81;0.84;1" dur="9s" repeatCount="indefinite"/></text>
<circle class="dot rej" r="6" cx="0" cy="0" opacity="0"><animateMotion path="M126,215 H316 L366,270 H530 L580,215 H806" dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;0.7255;0.7255" keyTimes="0;0.6;0.8467;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.62;0.8867;0.9467;1" dur="9s" repeatCount="indefinite"/><animate attributeName="r" values="6;6;6;1.5;1.5" keyTimes="0;0.8467;0.8867;0.9467;1" dur="9s" repeatCount="indefinite"/></circle><text class="lbl rej" x="671" y="300" text-anchor="middle" opacity="0">rejected: insufficient balance<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8467;0.8767;0.9567;0.9867;1" dur="9s" repeatCount="indefinite"/></text>
</g>
