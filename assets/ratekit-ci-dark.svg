<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
<title id="t">ratekit CI pipeline</title>
<desc id="d">A push or pull request starts the GitHub Actions workflow ci.yml. Job build and test runs checkout, set up JDK 21 and mvn verify, which runs the unit and integration tests with Testcontainers for Kafka and PostgreSQL. After it passes, job build images builds the ingest, rating and billing Docker images in three parallel lanes, with the shared common module built in. The images are built, not pushed. When every step passes the check is CI passed; if a step fails the run stops and the check is CI failed.</desc>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;fill:#e6edf3}
.t{font-size:16px;font-weight:600}
.s{font-size:13px;fill:#9198a1}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;fill:#9198a1}
.h{paint-order:stroke;stroke:#161b22;stroke-width:6px}
.box{fill:#161b22;stroke:#30363d;stroke-width:1.5}
.job{fill:#21262d;stroke:#30363d;stroke-width:1.5}
.step{fill:#161b22;stroke:#30363d;stroke-width:1.5}
.track{fill:#30363d}
.flow{fill:none;stroke:#6e7681;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.arr{fill:#6e7681}
.node{fill:#6e7681}
.dot{fill:#58a6ff}
.hl{fill:#58a6ff;fill-opacity:.12;stroke:#58a6ff;stroke-width:1.5}
.hlbad{fill:#f85149;fill-opacity:.1;stroke:#f85149;stroke-width:1.5}
.bar{fill:#58a6ff}.bar.ok{fill:#3fb950}
.ck{fill:none;stroke:#3fb950;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.disc{fill:#3fb950}.disc.bad{fill:#f85149}.disc.idle{fill:none;stroke:#6e7681;stroke-width:1.5;stroke-dasharray:4 4}
.on{fill:none;stroke:#0d1117;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.tp{fill:#3fb950}.tf{fill:#f85149}
.fail{fill:none;stroke:#f85149;stroke-width:1.5;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round;opacity:.5}
.failx{fill:none;stroke:#f85149;stroke-width:2;stroke-dasharray:6 5;stroke-linecap:round;stroke-linejoin:round}
.failh{fill:#f85149;opacity:.5}
.failt{font-size:13px;font-weight:600;fill:#f85149}
.still{display:none}
@media (prefers-reduced-motion:reduce){.live{display:none}.still{display:inline}}
</style>
