<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" width="960" height="900" role="img" aria-labelledby="t d">
<title id="t">ratekit objects: invoicing</title>
<desc id="d">Swimlane diagram of the objects in invoicing and the class that converts each. A JSON body with a period becomes an InvoiceRunRequest DTO (InvoiceRunController), BillingPeriodMapper parses it to the BillingPeriod record from the common module, and InvoiceRunService.run reads charges through ChargeUsageRepository as UsageRow objects, turns them into InvoiceLine objects and builds an Invoice with Invoice.of. InvoiceService.create and InvoiceRepository write the invoices and invoice_lines tables. The run returns a RunSummary that InvoiceMapper turns into an InvoiceRunResponse for the 200 answer. Reading an invoice: InvoiceRepository.find builds an Invoice from the rows, InvoiceMapper turns it into an InvoiceResponse and InvoiceController answers 200.</desc>
