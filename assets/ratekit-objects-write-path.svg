<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 958" width="960" height="958" role="img" aria-labelledby="t d">
<title id="t">ratekit objects: write path</title>
<desc id="d">Swimlane diagram of the objects on the write path and the class that converts each. A JSON body becomes an EventRequest DTO in ingest (EventController), the EventMapper converts it to the UsageEvent domain record from the common module, EventIngestService and EventPublisher write it to the usage-events Kafka topic keyed by accountId, and EventMapper turns the UsageEvent into an EventResponse for the 202 answer. In rating, UsageEventListener hands the UsageEvent to RatingService.handle, which uses ProcessedEventRepository for the processed_events table, TariffRepository and TariffMapper to turn tariffs rows into a Tariff with a PriceModel, TariffBook and Rater to compute a Charge with Money, AccountRepository to deduct the accounts balance, and ChargeRepository for charges or RejectedEventRepository for rejected_events. Permanent or exhausted failures go through DeadLetterProducer to the usage-events.dlq topic.</desc>
