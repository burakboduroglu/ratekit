server:
  port: 8081

spring:
  application:
    name: ratekit-ingest
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true

ratekit:
  ingest:
    event-time:
      # a client clock may run this far ahead of ours
      max-future-skew: PT5M
      # usage for a month is accepted this long after the month ends; keep it shorter than the gap
      # before billing invoices the month (02:00 UTC on the 1st)
      late-arrival-grace: PT1H

logging:
  pattern:
    # the API caller (ADR 0017) is in the MDC while a request runs
    level: "%5p [%X{caller:-}]"

management:
  endpoints:
    web:
      exposure:
        # only what operators need; nothing that changes state
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
