services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: ratekit
      POSTGRES_PASSWORD: ratekit
      POSTGRES_DB: ratekit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratekit -d ratekit"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      # cap the broker's heap so the whole stack fits a small VM (it was OOM-killed on a 2 GB one; 4 GB is recommended)
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  ingest:
    build:
      context: .
      args:
        SERVICE: ingest
    image: ratekit-ingest:dev
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # how long after a month ends its usage is still accepted (ADR 0007); widen it only for a demo
      RATEKIT_INGEST_EVENTTIME_LATEARRIVALGRACE: ${LATE_ARRIVAL_GRACE:-PT1H}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50
    mem_limit: 512m
    ports:
      - "8081:8081"
    healthcheck:
      # actuator health, not just an open port: UP only once the application (and its database) is ready
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: on-failure

  rating:
    build:
      context: .
      args:
        SERVICE: rating
    image: ratekit-rating:dev
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ratekit
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # listener threads; at most one per partition is useful (the topic has 3)
      SPRING_KAFKA_LISTENER_CONCURRENCY: ${RATING_CONCURRENCY:-1}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50
    mem_limit: 512m
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: on-failure

  billing:
    build:
      context: .
      args:
        SERVICE: billing
    image: ratekit-billing:dev
    depends_on:
      postgres:
        condition: service_healthy
      # billing reads rating's charges table, which rating's migration creates
      rating:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ratekit
      # billing asks Kafka how far rating has got before it invoices a month (ADR 0010)
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50
    mem_limit: 512m
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: on-failure

volumes:
  pgdata:
