# Dependabot opens pull requests for outdated dependencies; CI then proves whether the update builds.
# Versions in this repository are pinned on purpose, so updates arrive as reviewable PRs, never silently.
version: 2
updates:
  # parent pom (Spring Boot parent) and the module poms
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Boot-managed libraries move together with the parent; one PR instead of many
      spring-boot:
        patterns:
          - "org.springframework.boot*"

  # actions used by .github/workflows/ci.yml
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # base images in the Dockerfile (Maven build image and the JRE runtime image)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # pinned images in compose.yaml (PostgreSQL, Kafka)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
