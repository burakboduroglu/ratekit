name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a newer push to the same branch makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # unit tests plus integration tests; Testcontainers starts Kafka and PostgreSQL
      # with the Docker that comes on the runner
      - name: mvn verify
        run: mvn -B verify

  images:
    name: build image (${{ matrix.service }})
    needs: build-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ingest, rating, billing]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # built to prove the image builds, not pushed anywhere
      - name: docker build
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          push: false
          tags: ratekit-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
