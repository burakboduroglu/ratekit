server:
  port: 8082

spring:
  application:
    name: ratekit-rating
  datasource:
    url: jdbc:postgresql://localhost:5432/ratekit
    username: ratekit
    password: ratekit
  flyway:
    # billing migrates the same database with its own history table; if it starts first the schema
    # is not empty, so baseline at 0 and still run V1 onwards (ADR 0013)
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ratekit-rating
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer turns an unreadable message into an error the container can skip,
      # instead of failing on the same record forever.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: io.github.burakboduroglu.ratekit.common.UsageEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: io.github.burakboduroglu.ratekit.common

ratekit:
  rating:
    retention:
      # delete rejected events (and their idempotency rows) this long after rejection; rated events
      # are kept with their charges (ADR 0014). At least P35D, see RetentionProperties.
      enabled: true
      rejected-max-age: P90D
      batch-size: 1000
      # daily, 03:30 UTC, after billing's 02:00 run on the 1st
      cron: "0 30 3 * * *"
    retry:
      # transient failures are retried this many times with growing pauses, then dead-lettered
      max-retries: 4
      initial-interval-ms: 500
      multiplier: 2.0
      max-interval-ms: 5000

management:
  endpoints:
    web:
      exposure:
        # only what operators need; nothing that changes state
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
