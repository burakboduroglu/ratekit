server:
  port: 8083

spring:
  application:
    name: ratekit-billing
  datasource:
    # billing's own database (ADR 0019); it never reads rating's
    url: jdbc:postgresql://localhost:5433/billing
    username: billing
    password: billing
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      # reads the charges topic that rating's outbox relay writes
      group-id: ratekit-billing
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        # the type header names a charge or a progress marker; keep in step with Topics.CHARGES_TYPE_MAPPING
        spring.json.type.mapping: "charge:io.github.burakboduroglu.ratekit.common.ChargeEvent,watermark:io.github.burakboduroglu.ratekit.common.ChargeFeedWatermark"
        spring.json.trusted.packages: io.github.burakboduroglu.ratekit.common
  flyway:
    # migrations predate billing's own database, so they keep their folder and history table name
    locations: classpath:db/billing
    table: billing_schema_history

ratekit:
  billing:
    # accounts invoiced per database round trip during an invoice run
    batch-size: 500
    scheduler:
      # off by default: an invoice run is triggered by POST /v1/invoice-runs
      enabled: false
      # hourly from 02:00 UTC on the first day of the month, invoicing the month that just ended;
      # a run that finds rating behind is skipped, a run after the month is invoiced creates nothing
      cron: "0 0 2-23 1 * *"
    rating-progress:
      # refuse a run until rating has rated all usage accepted for the month (ADR 0010)
      enabled: true
      consumer-group: ratekit-rating
      # must equal ingest's ratekit.ingest.event-time.late-arrival-grace
      late-arrival-grace: PT1H
      timeout: PT10S
      # and the charges rating stored must have reached billing's table (ADR 0019): billing waits for a
      # progress marker from rating's relay newer than its own clock plus this margin ...
      clock-skew-margin: PT1S
      # ... for at most this long, then refuses the run (409)
      charge-feed-wait: PT30S

logging:
  pattern:
    # the API caller (ADR 0017) is in the MDC while a request runs
    level: "%5p [%X{caller:-}]"

management:
  endpoints:
    web:
      exposure:
        # only what operators need; nothing that changes state
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
